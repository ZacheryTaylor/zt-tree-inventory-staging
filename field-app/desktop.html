<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><link rel="icon" href="icons/icon-192.png" type="image/png">
<title>ZT Tree Inventory - Parcel sketch</title>
<link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="styles.css">
<style>
 main{max-width:1400px;padding-bottom:30px}.grid{display:grid;grid-template-columns:400px 1fr;gap:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
 #map{height:520px;border-radius:12px}@media(max-width:600px){#map{height:340px}}
 #sketch{width:100%;border:1px solid #ccc;border-radius:8px;background:#fff}
 footer{margin-bottom:20px}header{z-index:1000}
</style></head><body>
<header id="hdr"><div class="top"><h1 id="appName">ZT Tree Inventory &middot; Parcel sketch</h1><a class="jobchip" href="index.html" style="text-decoration:none">Field app</a></div>
<div class="sub">County parcel outline + tree points &rarr; PNG/PDF sketch (letter or 11x17) &middot; tree inventory data, not a survey</div></header>
<div class="banner" id="accBanner"></div>
<main><div class="grid">
<div>
 <section class="card"><h2>1 &middot; Trees</h2>
  <label for="jobSel">Job saved on this device</label><select id="jobSel"><option value="">(choose a job)</option></select>
  <label for="ptsFile">or import a job backup (.json), tree log (.csv) or PNEZD (.csv)</label><input type="file" id="ptsFile" accept=".json,.csv,application/json,text/csv">
  <label for="crs">Coordinate system (sketch and PNEZD import)</label><select id="crs"></select>
  <div class="status" id="tStat"></div>
 </section>
 <section class="card"><h2>2 &middot; Parcels</h2>
  <label for="jur">County / jurisdiction</label><select id="jur"></select>
  <label for="pids">Parcel ID(s) (one per line or comma separated)</label><textarea id="pids" placeholder="03-1S-31-1500-001-003"></textarea>
  <button id="loadP">Load parcel outline(s)</button><div class="status" id="pStat"></div>
 </section>
 <section class="card"><h2>3 &middot; Sketch</h2>
  <label for="proj">Job / title</label><input id="proj" placeholder="Job name">
  <div class="row"><div><label for="client">Client</label><input id="client"></div><div><label for="site">Site</label><input id="site"></div></div>
  <div class="row"><div><label for="page">Page size</label><select id="page"><option value="letter">Letter 8.5x11 (landscape)</option><option value="tabloid">Tabloid 11x17 (landscape)</option></select></div>
  <div><label for="base">Background</label><select id="base"></select></div></div>
  <label><input type="checkbox" id="accC" checked> Show reported GPS accuracy circles</label>
  <button id="render">Render sketch</button><button class="sec" id="png" disabled>Export PNG</button><button class="sec" id="pdf" disabled>Export PDF</button>
  <button class="sec" id="rpt" disabled>Tree Inventory Report (.pdf)</button>
  <div class="status" id="sStat"></div>
 </section>
</div>
<div>
 <div id="map" class="card" aria-label="Map preview"></div>
 <section class="card"><h2>Sketch preview</h2><canvas id="sketch" width="1100" height="850" role="img" aria-label="Tree location sketch preview"></canvas></section>
</div>
</div></main>
<footer id="foot"></footer>
<script src="vendor/proj4.js"></script><script src="vendor/leaflet.js"></script><script src="vendor/jspdf.umd.min.js"></script>
<script src="lib/core.js"></script><script src="lib/store.js"></script><script src="lib/parcels.js"></script><script src="lib/sketch.js"></script><script src="lib/report.js"></script><script src="desktop.js"></script>
</body></html>
